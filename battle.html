<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SortLab Battle - Race two sorting algorithms</title>
  <meta name="description" content="Pick two sorting algorithms and race them on the same array.">
  <meta name="theme-color" content="#07090f">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><img src="favicon.svg" alt="" width="28" height="28"><span>SortLab</span></a>
    <nav class="nav">
      <a href="index.html">Visualizer</a>
      <a href="battle.html" class="active">Battle</a>
    </nav>
    <button class="btn primary" id="openVideo">Make video</button>
  </header>

  <div class="modebar"><div class="chips" id="modeChips"></div></div>

  <main class="battle-grid">
    <section class="battle-panel">
      <div class="battle-head">
        <span class="tag">A</span>
        <div class="chips" id="algoA"></div>
      </div>
      <div class="battle-canvas"><canvas id="stageA"></canvas><span class="battle-stat" id="statA"></span></div>
    </section>
    <section class="battle-panel">
      <div class="battle-head">
        <span class="tag">B</span>
        <div class="chips" id="algoB"></div>
      </div>
      <div class="battle-canvas"><canvas id="stageB"></canvas><span class="battle-stat" id="statB"></span></div>
    </section>
    <div class="winner" id="winner"></div>
    <button class="sound-hint" id="soundHint">Tap for sound</button>
  </main>

  <section class="dock battle-dock">
    <button class="btn primary icon play" id="btnPlay" aria-label="Start or stop"></button>
    <button class="btn" id="openCustomize">Customize</button>
  </section>

  <aside class="drawer" id="drawer"></aside>
  <div class="modal" id="videoModal"></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="core.js"></script>
  <script src="algorithms.js"></script>
  <script src="player.js"></script>
  <script src="palettes.js"></script>
  <script src="audio.js"></script>
  <script src="renderer.js"></script>
  <script src="settings.js"></script>
  <script src="panel.js"></script>
  <script src="video.js"></script>
  <script src="battle.js"></script>
</body>
</html>
